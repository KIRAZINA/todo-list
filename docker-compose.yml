# Expected layout (the backend lives at the repo root in this project, so its
# build context is `.`):
#
#   project-root/
#     docker-compose.yml        <- this file
#     .env                      <- your real JWT_SECRET (see .env.example)
#     Dockerfile                <- existing Spring Boot backend Dockerfile
#     src/main/resources/application-docker.yml
#     frontend/                 <- the todo-frontend React app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USERNAME: todo
      DB_PASSWORD: todo
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file — see .env.example}
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Optional: bootstraps the very first ADMIN account on startup.
      # Leave empty (the default) to skip. Only set on the very first run.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  todo-db-data: