spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
jwt:
  secret: test-secret-key-1234567890abcdef-1234567890abcdef
  expiration-ms: 86400000

# The API test suite fires many auth requests from one "client" (localhost),
# so give the rate limiter a budget it will never hit in tests.
security:
  rate-limit:
    enabled: true
    max-requests: 100000
    window-ms: 60000

# Actuator config mirrors src/main/resources/application.yml. Spring Boot merges
# this profile file on top of the main application.yml for the "test" profile, so
# the exposure/security model the tests assert against is re-declared here and
# must be kept in sync with the main config.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: todo-list
    version: 1.0.0
    description: Todo List Backend API

